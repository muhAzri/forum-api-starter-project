services:
  app:
    build: .
    image: forum-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forum-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - forum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forum-network

volumes:
  forum-db-data:

networks:
  forum-network:
