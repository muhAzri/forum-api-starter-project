# NGINX configuration for Forum API
#
# Reverse proxies to the app container (published on 127.0.0.1:5000 by
# docker-compose.yml) and limits requests to /threads (and everything under
# it) to 90 requests/minute per client IP to mitigate DDoS/abuse.
#
# IMPORTANT: the app port must stay bound to 127.0.0.1 in docker-compose.yml.
# If it's ever exposed on 0.0.0.0, clients can hit the app directly and
# bypass this rate limiter entirely.
#
# Install on the server, e.g.:
#   sudo cp nginx.conf /etc/nginx/sites-available/forum-api
#   sudo ln -s /etc/nginx/sites-available/forum-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Domain: forum.zrifapps.my.id
# Obtain a certificate first (e.g. `sudo certbot --nginx -d forum.zrifapps.my.id`).

limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

upstream forum_api_upstream {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name forum.zrifapps.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name forum.zrifapps.my.id;

    ssl_certificate /etc/letsencrypt/live/forum.zrifapps.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.zrifapps.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Rate-limited resource: /threads and everything nested under it
    # (/threads/:id, /threads/:id/comments, /threads/:id/comments/:id/replies,
    # /threads/:id/comments/:id/likes, ...) - 90 req/min per IP.
    # The `^~` modifier pins this as a priority prefix match so no later
    # regex location can steal requests away from the rate limiter.
    location ^~ /threads {
        limit_req zone=threads_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://forum_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://forum_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
